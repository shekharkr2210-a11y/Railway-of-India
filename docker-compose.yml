services:
  ai-block-planner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ir-ai-block-planner
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_PATH=/app/data/blockplanner.db
      - HMAC_SECRET_KEY=IR_CRIS_PRODUCTION_SECURE_HMAC_KEY_2026
      - SESSION_SECRET=IR_CRIS_PRODUCTION_SIGNED_SESSION_SECRET_2026
      - SEED_ADMIN_PASSWORD=dev-admin1234
      - RATE_LIMIT_MAX=120
      - LOG_LEVEL=info
    volumes:
      - blockplanner-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  blockplanner-data:
    driver: local
